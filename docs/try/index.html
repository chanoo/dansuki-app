/* 퀴즈 */

.rbar { display: flex; align-items: center; gap: 14px; height: 56px; padding: 0 20px 0 12px; position: sticky; top: 0; background: var(--canvas); z-index: 3; }

.scrim { position: fixed; inset: 0; display: none; background: rgba(0,0,0,.38); opacity: 0; transition: opacity .25s; z-index: 10; }

.s-ko { padding: 12px 16px 14px; border-top: 1px solid var(--line); font-size: 16px; line-height: 1.55; }
.grow { display: flex; align-items: center; gap: 12px; padding: 14px 12px 14px 16px; width: 100%; text-align: left; }

.form small { display: block; font-size: 11px; font-weight: 700; color: var(--muted); }
.form .f { font-weight: 700; margin-top: 4px; }
.form .x { font-family: Literata, serif; font-size: 17px; margin-top: 8px; }
.form .xk { font-size: 13px; color: var(--muted); }
.wgrid { display: grid; grid-template-columns: 1fr 1fr; }
.wc { padding: 12px 12px 12px 16px; border-top: 1px solid var(--line); }
.wc:nth-child(odd) { border-right: 1px solid var(--line); }
.wc:nth-child(-n+2) { border-top: 0; }
.wc .w { font-family: Literata, serif; font-size: 15px; font-weight: 700; }
.wc .fm { font-size: 10px; font-weight: 700; padding: 1px 5px 2px; border-radius: 6px; background: var(--hlsoft); margin-left: 5px; vertical-align: 2px; }
.wc .m { font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
/* 읽기 설정 */
.set { padding: 4px 20px 26px; }
.set h4 { font-family: MaruBuri, serif; font-size: 19px; margin: 6px 0 12px; }
.sw { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); font-size: 16px; }
.sw:first-of-type { border-top: 0; }
.sw span { flex: 1; }
.sw small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.tog { width: 50px; height: 30px; border-radius: 15px; background: var(--empty); position: relative; transition: background .2s; flex: none; }
.tog::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 12px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }
.tog.on { background: var(--accent); }
.tog.on::after { transform: translateX(20px); }

/* 끝 */
.end { padding: 50px 20px 0; flex: 1; display: flex; flex-direction: column; }
.end h2 { font-family: MaruBuri, serif; font-size: 29px; line-height: 1.38; margin: 0; letter-spacing: -.3px; }
.end .note { color: var(--muted); font-size: 15px; line-height: 1.6; margin-top: 12px; }
.end .small { color: var(--muted); font-size: 13px; text-align: center; margin: 12px 0 0; }
.end .small a { color: var(--text); font-weight: 600; }
.spacer { flex: 1; min-height: 20px; }
.bottom { padding: 12px 20px 20px; }

// 발음 — 브라우저 음성(앱은 폰 안에서 만든 AI 목소리).
function say(text, onend) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.92;
    const v = speechSynthesis.getVoices().find(v => /en[-_]US/i.test(v.lang) && /Samantha|Google US|Aria|Jenny/i.test(v.name)) || speechSynthesis.getVoices().find(v => /en[-_]US/i.test(v.lang));
    if (v) u.voice = v;
    if (onend) u.onend = u.onerror = onend;
    speechSynthesis.speak(u);
  } catch (e) { onend && onend(); }
}
// 체험 이벤트(Firebase Analytics — 사이트 빌드에만 연결, 로컬 시안은 보내지 않음).
function track(n, p = {}) { try { window.__track ? window.__track(n, p) : (window.__tq = window.__tq || []).push([n, p]); } catch (e) {} }
let timers = [];
const later = (f, ms) => timers.push(setTimeout(f, ms));
const clearT = () => { timers.forEach(clearTimeout); timers = []; };
function show(html) {
  clearT();
  $('#view').innerHTML = `<div class="screen">${html}</div>`;
  window.scrollTo(0, 0);
}
const headBar = () => `
  <div class="shead"><button class="x" id="quit" aria-label="닫기">${I.x}</button>
    <div class="bars"><i><b style="width:${learned.size / N * 100}%"></b></i><i><b style="width:0"></b></i></div>
    <span class="cnt">단어 ${learned.size}/${N}</span></div>`;
const bindQuit = () => ($('#quit').onclick = () => { speechSynthesis.cancel(); track('trial_quit'); intro(); });

// ── 0. 소개 ──
function intro() {
  learned = new Set(); queue = []; tries = 0; rights = 0; got = {};
  show(`
    <div class="hero">
      <div class="brand"><img src="${MARK}" alt="">단숙이</div>
      <h1>단어 5개 외우고<br>셜록 홈스의 한마디에서<br>바로 만나 볼까요?</h1>
      <p>앱에서 하루 공부하는 그대로, 1분으로 줄였어요.</p>
      ${pic('calm', 'class="mascot"')}
      <div class="wordrow">${learn.map(w => `<span>${esc(w.word)}</span>`).join('')}</div>
      <div class="flow">
        <div><b>1</b><span>새 단어 카드 다섯 장<small>먼저 보고, 바로 문제로</small></span></div>
        <div><b>2</b><span>4초 안에 떠올려 맞히기<small>영어 → 뜻, 뜻 → 영어 둘 다</small></span></div>
        <div><b>3</b><span>「${esc(D.book.title)}」 ${D.book.n}장 한 문단 읽기<small>방금 외운 단어가 형광펜으로</small></span></div>
      </div>
      <div class="spacer"></div>
    </div>
    <div class="bottom"><button class="primary" id="go">시작하기</button></div>
  `);
  $('#go').onclick = () => { started = Date.now(); track('trial_start'); flash(0); };
}

// ── 1. 새 단어 카드(앱 플래시카드: '새 단어' · 점 · 단어 · 형광펜 뜻 · 아래 시간 막대 '곧 문제로 나와요 · 밀면 다음') ──
let learned = new Set(), started = 0;
function flash(i) {
  const w = learn[i];
  show(`
    ${headBar()}
    <div class="stack"><div class="card" id="fc">
      <div class="ftop"><span class="newchip">${I.book}새 단어</span>
        <span class="dots">${learn.map((_, k) => `<i class="${k === i ? 'on' : k < i ? 'done' : ''}"></i>`).join('')}</span><span class="n">${i + 1} / ${N}</span></div>
      <div class="fmid"><div class="fword">${esc(w.word)}</div><div class="fmean"><span class="mk">${esc(w.meaning)}</span></div>
        <button class="say" id="say" aria-label="발음 듣기">${I.sound}</button></div>
      <div class="fbar"><i id="fb"></i></div>
      <div class="fhint">곧 문제로 나와요 · 밀면 다음</div>
    </div></div>
  `);
  bindQuit();
  say(w.word);
  $('#say').onclick = e => { e.stopPropagation(); say(w.word); };
  const next = () => (i < N - 1 ? flash(i + 1) : (track('trial_cards_done'), ask()));
  const fb = $('#fb');
  requestAnimationFrame(() => { fb.style.transition = 'width 3.5s linear'; fb.style.width = '100%'; });
  later(next, 3600);
  const c = $('#fc'); let x0 = null;
  c.onclick = next;
  c.ontouchstart = e => (x0 = e.touches[0].clientX);
  c.ontouchend = e => { if (x0 !== null && x0 - e.changedTouches[0].clientX > 40) next(); x0 = null; };
}

// ── 2. 떠올리기 문제(앱: 1초 '먼저 떠올려 보세요' → 번호 보기 4개 · 회색 시간 막대 4초 · '모르겠어요') ──
// 체험은 영어 → 뜻 · 뜻 → 영어를 한 번씩 맞히면 외운 단어(앱은 각각 3번 연속).
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let queue = [], got = {}, tries = 0, rights = 0;
function quizInit() {
  queue = [...learn.map(w => ({ w, dir: 'enKo' })), ...shuffle(learn.map(w => ({ w, dir: 'koEn' })))];
  got = {}; tries = 0; rights = 0;
}
function ask() {
  if (!queue.length && !tries) quizInit();
  if (!queue.length) return summary();
  const q = queue[0], enKo = q.dir === 'enKo';
  const right = enKo ? first(q.w.meaning) : q.w.word;
  const opts = shuffle([right, ...(enKo ? q.w.enKo.map(first) : q.w.koEn)]);
  const g = got[q.w.id] || {};
  show(`
    ${headBar()}
    <div class="stack"><div class="card">
      <div class="qword"><div class="w ${enKo ? '' : 'ko'}">${esc(enKo ? q.w.word : q.w.meaning)}</div>
        ${enKo ? `<button class="say" id="say" aria-label="발음 듣기">${I.sound}</button>` : ''}</div>
      <div class="qbody" id="qb">
        <div class="recall">${pic('calm', '')}<b>${enKo ? '뜻을' : '영어를'} 먼저 떠올려 보세요</b><div class="rb"><i id="rb"></i></div><span>곧 보기가 나와요</span></div>
        <div class="tbar"><i></i></div>
      </div>
      <div class="dirs"><span class="k a ${g.enKo ? '' : ''}">A</span><i class="${g.enKo ? 'on' : ''}"></i><span class="gap"></span>
        <span class="k g ${g.koEn ? 'on' : ''}">가</span><i class="${g.koEn ? 'on' : ''}"></i></div>
    </div></div>
  `);
  bindQuit();
  if (enKo) { say(q.w.word); $('#say').onclick = () => say(q.w.word); }
  const rb = $('#rb');
  requestAnimationFrame(() => { rb.style.transition = 'width 1s linear'; rb.style.width = '100%'; });
  later(() => {
    $('#qb').innerHTML = `
      <div class="opts">${opts.map((o, k) => `<button class="opt ${enKo ? '' : 'en'}" data-v="${esc(o)}"><span class="no">${k + 1}</span><span>${esc(o)}</span></button>`).join('')}</div>
      <div class="tbar"><i id="tb"></i></div>
      <button class="dunno" id="dunno">모르겠어요</button>`;
    const tb = $('#tb');
    requestAnimationFrame(() => { tb.style.transition = 'transform 4s linear'; tb.style.transform = 'scaleX(0)'; });
    $$('.opt').forEach(b => (b.onclick = () => answer(b.dataset.v)));
    $('#dunno').onclick = () => answer('');
    later(() => answer(null), 4000);
  }, 1000);

  function answer(v) {
    clearT(); tries++;
    track('trial_answer', { dir: q.dir, correct: v === right ? 1 : 0, result: v === right ? 'right' : v === null ? 'timeout' : v === '' ? 'dunno' : 'wrong' });
    if (v === right) {
      rights++;
      got[q.w.id] = { ...(got[q.w.id] || {}), [q.dir]: true };
      if (got[q.w.id].enKo && got[q.w.id].koEn) learned.add(q.w.id);
      $$('.opt').forEach(b => {
        b.onclick = null;
        if (b.dataset.v === right) { b.classList.add('right'); b.querySelector('.no').innerHTML = I.check; }
        else b.classList.add('dim');
      });
      const tb = $('#tb'); if (tb) { const m = getComputedStyle(tb).transform; tb.style.transition = 'none'; tb.style.transform = m; }
      queue.shift();
      later(ask, 750);
    } else {
      queue.shift(); queue.push(q); // 틀린 문제는 뒤에서 다시
      wrong(q, v, right, enKo);
    }
  }
}
// 오답(앱: '내가 고른 답' · '정답은 이거예요' 형광펜 · 윙크 단숙이 · 예문 · 다음).
function wrong(q, v, right, enKo) {
  const ex = esc(q.w.example).replace(new RegExp(`\\b(${q.w.word}\\w*)`, 'i'), '<span class="mk">$1</span>');
  show(`
    ${headBar()}
    <div class="stack"><div class="card">
      <div class="qword"><div class="w">${esc(q.w.word)}</div><button class="say" id="say" aria-label="발음 듣기">${I.sound}</button></div>
      <div class="picked"><small>내가 고른 답</small><b>${v === null ? '4초가 지났어요' : v === '' ? '모르겠어요를 눌렀어요' : esc(v)}</b></div>
      <div class="answer"><div><small>정답은 이거예요</small><b class="mk ${enKo ? '' : 'en'}">${esc(enKo ? q.w.meaning : right)}</b></div>${pic('wink', '')}</div>
      <div class="ex"><div class="e">${ex}</div><div class="k">${esc(q.w.exampleKo)}</div></div>
      <div class="spacer"></div>
      <button class="primary" id="nx">다음</button>
      <p class="fhint">이 단어는 조금 뒤에 다시 물어볼게요</p>
    </div></div>
  `);
  bindQuit();
  $('#say').onclick = () => say(q.w.word);
  $('#nx').onclick = ask;
}

// ── 3. 결과(앱 공부 끝 화면: 수고했어요 · 칠한 칸 · 맞힌 문제 · 공부한 시간) ──
function summary() {
  const sec = Math.max(1, Math.round((Date.now() - started) / 1000));
  track('trial_quiz_done', { rights, tries, seconds: sec });
  show(`
    <div class="sum">
      <div class="kick">체험 끝</div>
      <div class="tt"><h2>수고했어요<br>단어 ${learned.size}개를<br>외웠어요</h2>${pic('cheer', '')}</div>
      <div class="cells">${learn.map((_, k) => `<i style="animation-delay:${0.15 + k * 0.12}s"></i>`).join('')}</div>
      <div class="big"><small>외운 단어</small><div><b>${learned.size}</b><span>/ 3,306</span></div>
        <p>외운 단어마다 키링 칸이 하나씩 칠해져요</p></div>
      <div class="stats">
        <div>${I.target}<span>맞힌 문제</span><b>${rights} / ${tries}</b></div>
        <div>${I.clock}<span>공부한 시간</span><b>${sec < 60 ? sec + '초' : Math.floor(sec / 60) + '분 ' + (sec % 60) + '초'}</b></div>
        <div>${I.cal}<span>다시 물어볼 날</span><b>2 · 7 · 21일 뒤</b></div>
      </div>
      <div class="q">방금 외운 단어, 이야기에서 만나 볼까요?</div>
    </div>
    <div class="bottom"><button class="primary" id="go">이야기 읽기<small>「${esc(D.book.title)}」 ${D.book.n}장</small></button></div>
  `);
  $('#go').onclick = () => { track('trial_reader_open'); reader(); };
}

// ── 4. 읽기(앱 읽기 화면 · 장 머리 · 단어 알약 · 떠 있는 플레이어 · Aa 읽기 설정 · 문장을 누르면 문장 풀이) ──
const plain = D.en.map(s => s[0]).join('');
const sentences = (() => {
  const out = []; let a = 0; const re = /[.?!]["”]?(?= +["“]?[A-Z])/g; let m;
  while ((m = re.exec(plain))) { const b = m.index + m[0].length; out.push([a, b]); a = b + 1; }
  out.push([a, plain.length]); return out;
})();
const chunkPos = (() => { let at = 0; return D.chunks.map(c => { const f = plain.indexOf(c[0].trim(), at); at = f + c[0].trim().length; return [f, at]; }); })();
const grammar = D.chunks.flatMap((c, k) => (c[2] || []).map(([anchor, term, note]) => {
  const f = plain.indexOf(anchor, chunkPos[k][0]); return { anchor, term, note, chunk: k, range: [f, f + anchor.length] };
}));
const segStarts = (() => { let at = 0; return D.en.map(s => { const r = at; at += s[0].length; return r; }); })();
let opt = { ko: false, paint: true, chunks: true };
function renderRange(a, b, { slashes, dotted, paint, gloss }) {
  const breaks = chunkPos.slice(1).map(p => p[0]).filter(x => x > a && x < b);
  const cuts = [...new Set([a, b, ...segStarts, ...breaks, ...grammar.flatMap(g => g.range)])].filter(x => x >= a && x <= b).sort((x, y) => x - y);
  let out = '';
  for (let i = 0; i < cuts.length - 1; i++) {
    const x = cuts[i], y = cuts[i + 1];
    if (slashes && breaks.includes(x)) out += ' <span class="sl">/</span> ';
    let s = 0; while (s + 1 < segStarts.length && segStarts[s + 1] <= x) s++;
    let text = plain.slice(x, y); if (i === 0) text = text.trimStart();
    if (slashes && breaks.includes(y)) text = text.trimEnd();
    let h = esc(text);
    if (paint && D.en[s][1] && D.learn.includes(D.en[s][1])) h = `<span class="mk">${h}</span>`;
    else if (dotted && grammar.some(g => x >= g.range[0] && y <= g.range[1])) h = `<span class="dotu">${h}</span>`;
    out += h;
    // 조각의 끝이면 어려운 말 뜻을 작게
    if (gloss && D.en[s][2] && y === segStarts[s] + D.en[s][0].length) out += `<span class="gl">${esc(D.en[s][2])}</span>`;
  }
  return out;
}
let playIdx = -1;
function reader() {
  show(`
    <div class="rbar"><button class="x" id="back" aria-label="뒤로">${I.back}</button><b>${esc(D.book.title)}</b></div>
    <div class="paper">
      <div class="chap"><div class="c">CHAPTER ${D.book.n}</div><h3>${esc(D.book.chapterEn)}</h3><div class="k">${esc(D.book.chapter)}</div>
        <div class="div"><i></i><b></b><i></i></div>
        <span class="wpill"><span><i style="background:var(--hl)"></i>단어 ${learned.size}/${D.book.words}</span><span><i style="background:#9FD2BB"></i>숙어 0/${D.book.idioms}</span></span></div>
      <div id="txt"></div>
      <div class="coach">${pic('calm', '')}<div><span class="mk">노랑</span>이 방금 외운 단어예요.<br><b>막히는 문장은 눌러 보세요.</b> 아래 Aa에서 해석 · 끊어 읽기를 켜요.</div></div>
      <div class="finish"><button class="primary" id="end">다 읽었어요</button></div>
    </div>
    <div class="mini"><div class="t"><b>${D.book.n}장 · ${esc(D.book.chapter)}</b><span>${esc(D.book.title)}</span></div>
      <button class="aa" id="aa" aria-label="읽기 설정">Aa</button><button class="pl" id="pl" aria-label="듣기">${I.play}</button></div>
  `);
  drawText();
  $('#back').onclick = summary;
  $('#end').onclick = () => { stopPlay(); track('trial_read_done'); end(); };
  $('#aa').onclick = settings;
  $('#pl').onclick = () => (playIdx >= 0 ? stopPlay() : (track('trial_listen'), playFrom(0)));
}
function drawText() {
  const dotted = opt.chunks && opt.ko;
  const html = sentences.map(([a, b], k) =>
    `<span class="sent ${k === playIdx ? 'now' : ''}" data-s="${k}">${renderRange(a, b, { slashes: opt.chunks, dotted, paint: opt.paint, gloss: true })}</span>`).join(' ');
  const ko = opt.ko ? `<div class="ko">${D.chunks.map((c, k) => esc(c[1]) + (opt.chunks ? (c[2] || []).map(g => ` <button class="gtag" data-g="${esc(g[0])}" data-c="${k}">${esc(g[1])}</button>`).join('') : ''))
    .join(opt.chunks ? ' <span class="sl">/</span> ' : ' ')}</div>` : '';
  $('#txt').innerHTML = `<div class="para">${html}</div>${ko}`;
  $$('.sent').forEach(el => (el.onclick = () => (playIdx >= 0 ? playFrom(+el.dataset.s) : openSentence(+el.dataset.s))));
  $$('.gtag').forEach(el => (el.onclick = e => {
    e.stopPropagation();
    const g = grammar.find(g => g.anchor === el.dataset.g && g.chunk === +el.dataset.c);
    openSentence(sentences.findIndex(([a, b]) => g.range[0] >= a && g.range[0] < b), g.anchor);
  }));
}
// 듣기: 문장마다 읽고 읽는 문장을 옅게 칠한다(앱 플레이어처럼). 듣는 중 문장을 누르면 그 문장부터.
function playFrom(k) {
  playIdx = k; drawText(); $('#pl').innerHTML = I.pause;
  const [a, b] = sentences[k];
  say(plain.slice(a, b).trim(), () => {
    if (playIdx !== k) return;
    if (k + 1 < sentences.length) playFrom(k + 1); else stopPlay();
  });
}
function stopPlay() {
  playIdx = -1; speechSynthesis.cancel();
  if ($('#pl')) { $('#pl').innerHTML = I.play; drawText(); }
}

// 시트
function openSheet(html, canvas) {
  const sh = $('#sheet');
  sh.className = 'sheet' + (canvas ? ' canvas' : '');
  sh.innerHTML = `<div class="grab"></div>${html}`;
  $('#scrim').style.display = 'block';
  requestAnimationFrame(() => { $('#scrim').classList.add('show'); sh.classList.add('show'); });
  $('#scrim').onclick = closeSheet;
  let y0 = null, dy = 0;
  sh.ontouchstart = e => { const b = $('.sb', sh); if (!b || b.scrollTop <= 0) { y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; } };
  sh.ontouchmove = e => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translateY(${dy}px)`; };
  sh.ontouchend = () => { if (y0 === null) return; sh.style.transition = ''; sh.style.transform = ''; y0 = null; if (dy > 96) closeSheet(); };
}
function closeSheet() {
  speechSynthesis.cancel();
  $('#scrim').classList.remove('show'); $('#sheet').classList.remove('show');
  $$('.sent.now').forEach(el => playIdx < 0 && el.classList.remove('now'));
  setTimeout(() => ($('#scrim').style.display = 'none'), 260);
}
function settings() {
  const row = (key, name, sub) => `<div class="sw"><span>${name}${sub ? `<small>${sub}</small>` : ''}</span><button class="tog ${opt[key] ? 'on' : ''}" data-k="${key}" aria-label="${name}"></button></div>`;
  openSheet(`<div class="set"><h4>읽기 설정</h4>
    ${row('ko', '해석 보기', '덩어리마다 뜻 · 문법 꼬리표')}
    ${row('paint', '아는 단어 칠하기', '외운 단어에 형광펜')}
    ${row('chunks', '뜻 덩어리마다 / 표시', '끊어 읽기')}</div>`, true);
  $$('.tog').forEach(b => (b.onclick = () => { opt[b.dataset.k] = !opt[b.dataset.k]; b.classList.toggle('on'); track('trial_setting', { key: b.dataset.k, on: opt[b.dataset.k] ? 1 : 0 }); drawText(); }));
}
let sPlaying = false;
function openSentence(k, openAnchor) {
  const [a, b] = sentences[k];
  track('trial_sentence_open', { sentence: k, via: openAnchor ? 'tag' : 'tap' });
  $$('.sent').forEach(el => el.classList.toggle('now', +el.dataset.s === k));
  const chunks = D.chunks.filter((c, i) => chunkPos[i][0] < b && chunkPos[i][1] > a);
  const gs = grammar.filter(g => g.range[0] >= a && g.range[0] < b);
  const seen = new Set(), ws = []; let at = 0;
  for (const s of D.en) { if (s[1] && at >= a && at < b && !seen.has(s[1])) { seen.add(s[1]); ws.push(s); } at += s[0].length; }
  const text = plain.slice(a, b).trim();
  const gRow = g => {
    const [main, sub] = g.note.split(' · '); const [l, r] = main.split(' = ');
    const tm = D.terms[g.term]; const m = tm.form.match(/^(.*?)\s*\((.*=.*)\)\s*$/);
    const ex = m ? m[2].split(' · ')[0].split(' = ') : null; const open = openAnchor === g.anchor;
    return `<button class="grow ${open ? 'open' : ''}"><span class="gtag" style="margin:0">${esc(g.term)}</span>
        <span class="eq"><b>${r ? `<i>${esc(l)}</i> = ${esc(r)}` : esc(main)}</b>${sub ? `<span>${esc(sub)}</span>` : ''}</span>${I.chev}</button>
      <div class="gopen" ${open ? '' : 'hidden'}><div class="mean">${esc(tm.mean)}</div>
        ${tm.use ? `<div class="pt"><i>→</i><span><b>언제 · 어디서</b>${esc(tm.use)}</span></div>` : ''}
        ${tm.note ? `<div class="pt warn"><i>!</i><span><b>헷갈리기 쉬운 것</b>${esc(tm.note)}</span></div>` : ''}
        <div class="form"><small>모양</small><div class="f">${esc(m ? m[1] : tm.form)}</div>${ex ? `<div class="x">${esc(ex[0])}</div><div class="xk">${esc(ex[1])}</div>` : ''}</div></div>`;
  };
  openSheet(`
    <div class="hh"><button class="circle play" id="sp" aria-label="이 문장 듣기"><span>${I.play}</span></button>
      <span class="ttl">${D.book.n}장 · ${esc(D.book.chapter)}</span><button class="circle x" id="sx" aria-label="닫기"><span>${I.xs}</span></button></div>
    <div class="sb">
      <div class="gc"><div class="s-en">${renderRange(a, b, { slashes: true, dotted: true, paint: false })}</div>
        ${chunks.length ? `<div class="s-ko">${chunks.map(c => esc(c[1])).join(' <span class="sl">/</span> ')}</div>` : ''}</div>
      ${gs.length ? `<div class="lab">문법 ${gs.length}</div><div class="gc">${gs.map(gRow).join('')}</div>` : ''}
      <div class="lab">단어 ${ws.length}<span>외운 단어는 형광펜</span></div>
      <div class="gc"><div class="wgrid">${ws.map(([surface, id]) => {
        const w = D.words[id]; const f = D.forms[`${surface}|${w.word}`]; const known = learned.has(id);
        return `<div class="wc"><span class="w ${known ? 'mk' : ''}">${esc(surface)}</span>${f ? `<span class="fm">${esc(w.word)} ${esc(f[0])}</span>` : ''}<div class="m">${esc(f ? f[1] : first(w.meaning))}</div></div>`;
      }).join('')}</div></div>
    </div>`);
  $('#sx').onclick = closeSheet;
  const sp = $('#sp'); sPlaying = false;
  sp.onclick = () => {
    if (sPlaying) { speechSynthesis.cancel(); sPlaying = false; sp.firstElementChild.innerHTML = I.play; return; }
    sPlaying = true; sp.firstElementChild.innerHTML = I.stop;
    say(text, () => { sPlaying = false; sp.firstElementChild.innerHTML = I.play; });
  };
  $$('.grow').forEach(r => (r.onclick = () => { r.classList.toggle('open'); r.nextElementSibling.hidden = !r.classList.contains('open'); if (r.classList.contains('open')) track('trial_grammar_open', { term: r.querySelector('.gtag').textContent }); }));
}

// ── 5. 끝 ──
function end() {
  show(`
    <div class="end">
      <h2>방금 외운 ${learned.size}개,<br>홈스의 한마디에<br>다 나왔어요</h2>
      <p class="note">단숙이는 이렇게 매일 단어 20개 · 숙어 5개를 외우고, 외운 단어를 이야기에서 다시 만나요.</p>
      <div class="stats">
        <div>${I.book.replace('<svg', '<svg style="fill:var(--muted);stroke:none"')}<span>단어 · 숙어</span><b>3,306개 · 510개</b></div>
        <div>${I.target}<span>이야기에 나오는 단어</span><b>3,202개</b></div>
        <div>${I.cal}<span>다시 쓴 이야기</span><b>19편</b></div>
      </div>
      <p class="small">무료 · 광고 없음 · 가입 없음</p>
      <div class="spacer"></div>
    </div>
    <div class="bottom">
      <a class="primary" id="store" href="https://apps.apple.com/kr/app/id6819707350">App Store에서 받기</a>
      <a class="secondary" id="android" href="https://dansuki.com/android/">Android 먼저 써 보기<small>비공개 테스트 중 · 신청하면 테스터로 등록해 드려요</small></a>
      <button class="link" id="again">처음부터 다시</button>
    </div>
  `);
  $('#again').onclick = () => { track('trial_restart'); intro(); };
  $('#store').onclick = () => track('trial_store_click');
  $('#android').onclick = () => track('trial_android_click');
  track('trial_end', { learned: learned.size });
}

intro();
</script>
