:root {

} }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* ── 소개 ── */
.hero { padding: 40px 20px 0; flex: 1; display: flex; flex-direction: column; }

.fbar { height: 5px; border-radius: 3px; background: var(--empty); overflow: hidden; }
.fbar i { display: block; height: 100%; width: 0; background: var(--text); }

/* 퀴즈 */
.qword { text-align: center; margin-top: 26px; }
.qword .w { font-family: Literata, serif; font-weight: 600; font-size: 46px; letter-spacing: -.4px; line-height: 1.15; }

.opt:active { transform: scale(.98); }

.dunno { text-align: center; font-size: 19px; color: var(--muted); padding: 18px 0 4px; }
.dirs { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: auto; padding-top: 14px; }

.dirs i::after { content: ''; width: 6px; height: 6px; border-radius: 3px; background: var(--empty); }

/* 오답 */
.picked { display: flex; align-items: baseline; gap: 14px; padding: 16px 18px; border-radius: 18px; background: var(--panel); margin-top: 6px; }

.answer div { flex: 1; }
.answer small { display: block; color: var(--muted); font-size: 16px; }
.answer b { display: inline; font-size: 30px; font-weight: 800; line-height: 1.4; }
.answer img { width: 74px; margin-left: 8px; }
.ex { margin-top: 18px; }
.ex .e { font-family: Literata, serif; font-size: 21px; line-height: 1.5; }
.ex .k { color: var(--muted); font-size: 16px; margin-top: 4px; }

/* 결과 */
.sum { padding: 50px 20px 0; flex: 1; display: flex; flex-direction: column; }

.big span { color: var(--muted); font-size: 24px; }
.big p { color: var(--muted); font-size: 15px; margin: 10px 0 0; }
.stats { margin-top: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 26px; padding: 0 22px; }
.stats div { display: flex; align-items: center; gap: 12px; padding: 17px 0; font-size: 16px; color: var(--muted); }
.stats div + div { border-top: 1px solid var(--line); }
.stats svg { width: 22px; height: 22px; stroke: var(--muted); fill: none; stroke-width: 2; }
.stats b { margin-left: auto; color: var(--text); font-size: 17px; }
.sum .q { text-align: center; font-weight: 700; font-size: 17px; margin: 26px 0 12px; }

/* 읽기 */
.rbar { display: flex; align-items: center; gap: 14px; height: 56px; padding: 0 20px 0 12px; position: sticky; top: 0; background: var(--canvas); z-index: 3; }
.rbar .x { width: 44px; height: 44px; display: grid; place-items: center; }

.paper { margin: 6px 10px 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px 8px 0 0; padding: 30px 20px 140px; flex: 1; }
.chap { text-align: center; }
.chap .c { font-family: Literata, serif; letter-spacing: 6px; font-size: 13px; color: var(--muted); }

.chap .k { font-family: MaruBuri, serif; color: var(--muted); font-size: 16px; }
.chap .div { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 16px 0; }
.chap .div i { width: 70px; height: 1px; background: var(--line); }

.wpill { display: inline-flex; align-items: center; gap: 12px; height: 40px; padding: 0 18px; border-radius: 20px; border: 1px solid var(--line); font-size: 15px; color: var(--muted); }

.sent { border-radius: 4px; cursor: pointer; transition: background .25s; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.sent.now { background: var(--hlsoft); }
.sl { color: var(--gold); font-family: Pretendard, sans-serif; font-weight: 700; margin: 0 3px; }
.dotu { text-decoration: underline dotted var(--gold) 2px; text-underline-offset: 5px; }
.gl { font-family: Pretendard, sans-serif; font-size: 12px; color: var(--muted); margin: 0 3px 0 4px; }
.ko { margin-top: 12px; font-size: 16px; line-height: 1.85; color: var(--muted); }
.gtag { display: inline-block; font-size: 12px; font-weight: 600; line-height: 1; padding: 3px 7px 4px; margin-left: 4px; border-radius: 99px; background: var(--hlsoft); border: 1px solid var(--hl); color: var(--text); vertical-align: 1px; cursor: pointer; }
.coach { margin-top: 22px; display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 18px; background: var(--panel); font-size: 15px; line-height: 1.5; }
.coach img { width: 46px; flex: none; }
.finish { margin-top: 28px; }
.mini { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); width: min(400px, calc(100% - 28px)); display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 20px; border-radius: 30px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 8px 24px -8px rgba(35,33,30,.25); z-index: 4; }
.mini .t { flex: 1; min-width: 0; }
.mini .t b { display: block; font-family: MaruBuri, serif; font-size: 16px; }
.mini .t span { display: block; font-size: 13px; color: var(--muted); }
.mini .aa { width: 44px; height: 44px; border-radius: 22px; background: var(--sunk); font-family: Literata, serif; font-weight: 700; font-size: 18px; }
.mini .pl { width: 48px; height: 48px; border-radius: 24px; background: var(--accent); display: grid; place-items: center; }
.mini .pl svg { width: 22px; height: 22px; fill: var(--onaccent); }

/* 시트(앱 공통 시트 · 문장 풀이 그룹 카드) */
.scrim { position: fixed; inset: 0; display: none; background: rgba(0,0,0,.38); opacity: 0; transition: opacity .25s; z-index: 10; }
.scrim.show { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 440px; margin: 0 auto; max-height: 75dvh; background: var(--sunk); border-radius: 30px 30px 0 0; z-index: 11; transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.18); }
.sheet.canvas { background: var(--canvas); }
.sheet.show { transform: none; }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--empty); margin: 10px auto 0; flex: none; }
.hh { display: flex; align-items: center; padding: 0 8px; flex: none; }
.hh .ttl { flex: 1; text-align: center; font-weight: 700; font-size: 14px; }
.circle { width: 44px; height: 44px; display: grid; place-items: center; }
.circle span { width: 30px; height: 30px; border-radius: 15px; display: grid; place-items: center; }

.circle.play svg { fill: var(--onaccent); width: 16px; height: 16px; }
.circle.x span { background: rgba(127,120,110,.14); }
.circle.x svg { stroke: var(--muted); width: 14px; height: 14px; }
.sb { overflow-y: auto; padding: 4px 16px calc(24px + env(safe-area-inset-bottom)); }
.gc { background: var(--surface); border-radius: 22px; overflow: hidden; }
.lab { font-size: 12px; font-weight: 700; color: var(--muted); margin: 18px 8px 6px; display: flex; justify-content: space-between; }

.s-en { padding: 16px 16px 12px; font-family: Literata, serif; font-size: 20px; line-height: 1.5; }
.s-ko { padding: 12px 16px 14px; border-top: 1px solid var(--line); font-size: 16px; line-height: 1.55; }
.grow { display: flex; align-items: center; gap: 12px; padding: 14px 12px 14px 16px; width: 100%; text-align: left; }
.gopen + .grow, .grow + .grow { border-top: 1px solid var(--line); }
.grow .eq { flex: 1; }
.grow .eq b { display: block; font-size: 15px; }
.grow .eq b i { font-family: Literata, serif; font-style: normal; }
.grow .eq span { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
.grow .chev { width: 22px; height: 22px; stroke: var(--faint); transition: transform .2s; flex: none; }
.grow.open .chev { transform: rotate(180deg); }
.gopen { padding: 0 16px 16px; }

.pt { display: flex; gap: 8px; margin-top: 8px; font-size: 14px; line-height: 1.6; }

.pt b { margin-right: 4px; }
.form { margin-top: 12px; padding: 10px 12px 12px; border-radius: 14px; background: var(--hlsoft); font-size: 14px; }
.form small { display: block; font-size: 11px; font-weight: 700; color: var(--muted); }
.form .f { font-weight: 700; margin-top: 4px; }
.form .x { font-family: Literata, serif; font-size: 17px; margin-top: 8px; }
.form .xk { font-size: 13px; color: var(--muted); }
.wgrid { display: grid; grid-template-columns: 1fr 1fr; }
.wc { padding: 12px 12px 12px 16px; border-top: 1px solid var(--line); }
.wc:nth-child(odd) { border-right: 1px solid var(--line); }
.wc:nth-child(-n+2) { border-top: 0; }
.wc .w { font-family: Literata, serif; font-size: 15px; font-weight: 700; }
.wc .fm { font-size: 10px; font-weight: 700; padding: 1px 5px 2px; border-radius: 6px; background: var(--hlsoft); margin-left: 5px; vertical-align: 2px; }
.wc .m { font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
/* 읽기 설정 */
.set { padding: 4px 20px 26px; }
.set h4 { font-family: MaruBuri, serif; font-size: 19px; margin: 6px 0 12px; }
.sw { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); font-size: 16px; }
.sw:first-of-type { border-top: 0; }
.sw span { flex: 1; }
.sw small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.tog { width: 50px; height: 30px; border-radius: 15px; background: var(--empty); position: relative; transition: background .2s; flex: none; }
.tog::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 12px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }
.tog.on { background: var(--accent); }
.tog.on::after { transform: translateX(20px); }

/* 끝 */
.end { padding: 50px 20px 0; flex: 1; display: flex; flex-direction: column; }
.end h2 { font-family: MaruBuri, serif; font-size: 29px; line-height: 1.38; margin: 0; letter-spacing: -.3px; }
.end .note { color: var(--muted); font-size: 15px; line-height: 1.6; margin-top: 12px; }
.end .small { color: var(--muted); font-size: 13px; text-align: center; margin: 12px 0 0; }
.end .small a { color: var(--text); font-weight: 600; }
.spacer { flex: 1; min-height: 20px; }
.bottom { padding: 12px 20px 20px; }

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function ask() {

  later(() => {
    $('#qb').innerHTML = `
      <div class="opts">${opts.map((o, k) => `<button class="opt ${enKo ? '' : 'en'}" data-v="${esc(o)}"><span class="no">${k + 1}</span><span>${esc(o)}</span></button>`).join('')}</div>

// ── 4. 읽기(앱 읽기 화면 · 장 머리 · 단어 알약 · 떠 있는 플레이어 · Aa 읽기 설정 · 문장을 누르면 문장 풀이) ──
const plain = D.en.map(s => s[0]).join('');
const sEnd = plain.indexOf('Street.') + 7;
const sentences = [[0, sEnd], [sEnd + 1, plain.length]];
const chunkPos = (() => { let at = 0; return D.chunks.map(c => { const f = plain.indexOf(c[0].trim(), at); at = f + c[0].trim().length; return [f, at]; }); })();
const grammar = D.chunks.flatMap((c, k) => (c[2] || []).map(([anchor, term, note]) => {
  const f = plain.indexOf(anchor, chunkPos[k][0]); return { anchor, term, note, chunk: k, range: [f, f + anchor.length] };
}));
const segStarts = (() => { let at = 0; return D.en.map(s => { const r = at; at += s[0].length; return r; }); })();
let opt = { ko: false, paint: true, chunks: true };
function renderRange(a, b, { slashes, dotted, paint }) {
  const breaks = chunkPos.slice(1).map(p => p[0]).filter(x => x > a && x < b);
  const cuts = [...new Set([a, b, ...segStarts, ...breaks, ...grammar.flatMap(g => g.range)])].filter(x => x >= a && x <= b).sort((x, y) => x - y);
  let out = '';
  for (let i = 0; i < cuts.length - 1; i++) {
    const x = cuts[i], y = cuts[i + 1];
    if (slashes && breaks.includes(x)) out += ' <span class="sl">/</span> ';
    let s = 0; while (s + 1 < segStarts.length && segStarts[s + 1] <= x) s++;
    let text = plain.slice(x, y); if (i === 0) text = text.trimStart();
    if (slashes && breaks.includes(y)) text = text.trimEnd();
    let h = esc(text);
    if (paint && D.en[s][1] && D.learn.includes(D.en[s][1])) h = `<span class="mk">${h}</span>`;
    else if (dotted && grammar.some(g => x >= g.range[0] && y <= g.range[1])) h = `<span class="dotu">${h}</span>`;
    out += h;
  }

}
let playIdx = -1;
function reader() {

  const ko = opt.ko ? `<div class="ko">${D.chunks.map((c, k) => esc(c[1]) + (opt.chunks ? (c[2] || []).map(g => ` <button class="gtag" data-g="${esc(g[0])}" data-c="${k}">${esc(g[1])}</button>`).join('') : ''))

      <div class="gc"><div class="s-en">${renderRange(a, b, { slashes: true, dotted: true, paint: false })}</div>
        ${chunks.length ? `<div class="s-ko">${chunks.map(c => esc(c[1])).join(' <span class="sl">/</span> ')}</div>` : ''}</div>
      ${gs.length ? `<div class="lab">문법 ${gs.length}</div><div class="gc">${gs.map(gRow).join('')}</div>` : ''}
      <div class="lab">단어 ${ws.length}<span>외운 단어는 형광펜</span></div>
      <div class="gc"><div class="wgrid">${ws.map(([surface, id]) => {
        const w = D.words[id]; const f = D.forms[`${surface}|${w.word}`]; const known = learned.has(id);
        return `<div class="wc"><span class="w ${known ? 'mk' : ''}">${esc(surface)}</span>${f ? `<span class="fm">${esc(w.word)} ${esc(f[0])}</span>` : ''}<div class="m">${esc(f ? f[1] : first(w.meaning))}</div></div>`;
      }).join('')}</div></div>
    </div>`);
  $('#sx').onclick = closeSheet;
  const sp = $('#sp'); sPlaying = false;
  sp.onclick = () => {
    if (sPlaying) { speechSynthesis.cancel(); sPlaying = false; sp.firstElementChild.innerHTML = I.play; return; }
    sPlaying = true; sp.firstElementChild.innerHTML = I.stop;
    say(text, () => { sPlaying = false; sp.firstElementChild.innerHTML = I.play; });
  };
  $$('.grow').forEach(r => (r.onclick = () => { r.classList.toggle('open'); r.nextElementSibling.hidden = !r.classList.contains('open'); if (r.classList.contains('open')) track('trial_grammar_open', { term: r.querySelector('.gtag').textContent }); }));
}

// ── 5. 끝 ──
function end() {
  show(`
    <div class="end">
      <h2>방금 외운 ${learned.size}개,<br>셜록 홈스 첫 문단에<br>다 나왔어요</h2>
      <p class="note">단숙이는 이렇게 매일 단어 20개 · 숙어 5개를 외우고, 외운 단어를 이야기에서 다시 만나요.</p>
      <div class="stats">
        <div>${I.book.replace('<svg', '<svg style="fill:var(--muted);stroke:none"')}<span>단어 · 숙어</span><b>3,306개 · 510개</b></div>
        <div>${I.target}<span>이야기에 나오는 단어</span><b>3,202개</b></div>
        <div>${I.cal}<span>다시 쓴 이야기</span><b>19편</b></div>
      </div>
      <p class="small">무료 · 광고 없음 · 가입 없음</p>
      <div class="spacer"></div>
    </div>
    <div class="bottom">
      <a class="primary" id="store" href="https://apps.apple.com/kr/app/id6819707350">App Store에서 받기</a>
      <p class="end small" style="padding:0">Android는 비공개 테스트 중이에요 · <a id="android" href="https://dansuki.com/android/">먼저 써 보기 신청</a></p>
      <button class="link" id="again">처음부터 다시</button>
    </div>
  `);
  $('#again').onclick = () => { track('trial_restart'); intro(); };
  $('#store').onclick = () => track('trial_store_click');
  $('#android').onclick = () => track('trial_android_click');
  track('trial_end', { learned: learned.size });
}

intro();
</script>
</body>
</html>
