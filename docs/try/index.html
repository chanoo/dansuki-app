.opt.en { font-size: 19px; }

.opt.right { background: var(--hl); border-color: var(--hl); color: #23211E; }

// 발음: 브라우저 음성(앱은 폰 안 AI 목소리).
function say(text, onend) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.9;
    const v = speechSynthesis.getVoices().find(v => /en-US/i.test(v.lang));
    if (v) u.voice = v;
    if (onend) u.onend = u.onerror = onend;
    speechSynthesis.speak(u);
  } catch (e) { onend && onend(); }
}

// 1. 카드
function cards(i) {
  const w = learn[i];
  const ex = esc(w.example).replace(new RegExp(`\\b(${w.word}\\w*)`, 'i'), '<span class="mark">$1</span>');
  show(`
    <div class="counter"><span>카드 ${i + 1} / ${learn.length}</span><span>먼저 보고, 바로 문제로</span></div>
    <div class="card flash">
      <div class="w">${esc(w.word)}<button class="say" id="say" aria-label="발음 듣기">${ICON.sound}</button></div>
      <div class="m">${esc(w.meaning)}</div>
      <div class="ex"><div class="e">${ex}</div><div class="k">${esc(w.exampleKo)}</div></div>
    </div>
    <p class="note">단숙이는 처음 보는 단어를 문제부터 내지 않아요.</p>
    <div class="spacer"></div>
    <button class="primary" id="next">${i < learn.length - 1 ? '다음 카드' : '문제 풀기'}</button>
  `, 0);

// 2. 퀴즈 — 보기는 1초 뒤, 4초 안에. 영어 → 뜻 · 뜻 → 영어를 다 맞히면 외운 단어(앱은 각각 3번 연속).
let queue, done, learned, total;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function quizStart() {
  queue = [...learn.map(w => ({ w, dir: 'enKo' })), ...shuffle(learn.map(w => ({ w, dir: 'koEn' })))];
  total = queue.length; done = {}; learned = new Set();
  ask();
}
let timers = [];
function clearTimers() { timers.forEach(clearTimeout); timers = []; }
function ask() {
  clearTimers();
  if (!queue.length) return ringScreen();
  const q = queue[0];
  const enKo = q.dir === 'enKo';
  const right = enKo ? first(q.w.meaning) : q.w.word;
  const opts = shuffle([right, ...(enKo ? q.w.enKo.map(first) : q.w.koEn)]);
  const okCount = total - queue.length;
  show(`
    <div class="qtop"><div class="bar"><i style="width:${okCount / total * 100}%"></i></div>
      <div class="pieces" aria-label="외운 단어 ${learned.size}개">${learn.map(w => `<i class="${learned.has(w.id) ? 'on' : ''}"></i>`).join('')}</div></div>
    <div class="dir">${enKo ? '영어 → 뜻' : '뜻 → 영어'}</div>
    <div class="prompt"><div class="p ${enKo ? 'en' : 'ko'}">${esc(enKo ? q.w.word : q.w.meaning)}</div></div>
    <div class="timer"><i id="t"></i></div>
    <div class="think" id="think">먼저 떠올려 보세요…</div>
    <div class="opts">${opts.map(o => `<button class="opt hidden ${enKo ? '' : 'en'}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>
    <div id="after"></div>
  `, 1);
  if (enKo) say(q.w.word);
  const t = $('#t');
  timers.push(setTimeout(() => {
    $('#think').textContent = '4초 안에 골라요';
    document.querySelectorAll('.opt').forEach(b => b.classList.remove('hidden'));
    t.style.transition = 'transform 4s linear';
    requestAnimationFrame(() => (t.style.transform = 'scaleX(0)'));
    timers.push(setTimeout(() => answer(null), 4000));
  }, 1000));
  document.querySelectorAll('.opt').forEach(b => (b.onclick = () => answer(b.dataset.v)));

  function answer(v) {
    clearTimers();
    const tf = getComputedStyle(t).transform; t.style.transition = 'none'; t.style.transform = tf;
    const ok = v === right;
    document.querySelectorAll('.opt').forEach(b => {
      b.onclick = null; b.classList.remove('hidden');
      if (b.dataset.v === right) b.classList.add('right');
      else if (b.dataset.v === v) b.classList.add('wrong');
      else b.classList.add('dim');
    });
    queue.shift();
    if (ok) {
      done[q.w.id] = (done[q.w.id] || 0) + 1;
      if (done[q.w.id] === 2) learned.add(q.w.id);
      $('#think').textContent = done[q.w.id] === 2 ? `외웠어요! ${q.w.word} 조각 하나` : '맞혔어요';
      timers.push(setTimeout(ask, 750));
    } else {
      queue.push(q); // 틀린 문제는 뒤에서 다시
      $('#think').textContent = '';
      $('#after').innerHTML = `<div class="verdict"><b>${v === null ? '4초가 지났어요' : '아쉬워요'}</b> · 정답은 ${esc(right)}. 뒤에서 다시 물어볼게요.
        <div class="e">${esc(q.w.example)}</div></div><button class="primary" id="nx">계속</button>`;
      $('#nx').onclick = ask;
    }
  }
}

// 4. 이야기 — 「빨간 머리 연맹」 1장 첫 문단(앱 데이터 그대로).
const plain = D.en.map(s => s[0]).join('');
const sEnd = plain.indexOf('Street.') + 7;
const sentences = [[0, sEnd], [sEnd + 1, plain.length]];
const chunkPos = (() => { let at = 0; return D.chunks.map(c => { const f = plain.indexOf(c[0].trim(), at); at = f + c[0].trim().length; return [f, at]; }); })();
const grammar = D.chunks.flatMap((c, k) => (c[2] || []).map(([anchor, term, note]) => {
  const f = plain.indexOf(anchor, chunkPos[k][0]); return { anchor, term, note, chunk: k, range: [f, f + anchor.length] };
}));
let opt = { chunks: true, ko: true };
// 문장 [a, b)를 조각으로: 외운 단어 형광펜 · 덩어리 사이 사선 · 꼬리표 말 점선.
const segStarts = (() => { let at = 0; return D.en.map(s => { const r = at; at += s[0].length; return r; }); })();
function renderRange(a, b, { slashes, dotted }) {
  const breaks = chunkPos.slice(1).map(p => p[0]).filter(x => x > a && x < b);
  const cuts = [...new Set([a, b, ...segStarts, ...breaks, ...grammar.flatMap(g => g.range)])].filter(x => x >= a && x <= b).sort((x, y) => x - y);
  let out = '';
  for (let i = 0; i < cuts.length - 1; i++) {
    const x = cuts[i], y = cuts[i + 1];
    if (slashes && breaks.includes(x)) out += ' <span class="sl">/</span> ';
    let s = 0; while (s + 1 < segStarts.length && segStarts[s + 1] <= x) s++;
    let text = plain.slice(x, y); if (i === 0) text = text.trimStart();
    if (slashes && breaks.includes(y)) text = text.trimEnd();
    let h = esc(text);
    if (D.en[s][1] && D.learn.includes(D.en[s][1])) h = `<span class="mark">${h}</span>`;
    else if (dotted && grammar.some(g => x >= g.range[0] && y <= g.range[1])) h = `<span class="dotu">${h}</span>`;
    out += h;
  }
  return out;
}
function story() {
  const html = sentences.map(([a, b], k) =>
    `<span class="sent" data-s="${k}">${renderRange(a, b, { slashes: opt.chunks, dotted: opt.chunks && opt.ko })}</span>`).join(' ');
  const ko = D.chunks.map((c, k) => esc(c[1]) + (opt.chunks ? (c[2] || []).map(g => ` <button class="gtag" data-g="${esc(g[0])}" data-c="${k}">${esc(g[1])}</button>`).join('') : ''))
    .join(opt.chunks ? ' <span class="sl">/</span> ' : ' ');
  show(`
    <div class="book"><div class="t">${esc(D.book.title)}</div><div class="s">1장 · ${esc(D.book.chapter)}</div></div>
    <div class="toggles">
      <button class="tg ${opt.chunks ? 'on' : ''}" id="tc">끊어 읽기 /</button>
      <button class="tg ${opt.ko ? 'on' : ''}" id="tk">해석 보기</button>
    </div>
    <div class="tip"><span class="mark">노랑</span>이 방금 외운 단어예요. <b>막히는 문장은 눌러 보세요.</b></div>
    <div class="card page">
      <div class="para">${html}</div>
      ${opt.ko ? `<div class="ko">${ko}</div>` : ''}
    </div>
    <div class="spacer"></div>
    <button class="primary" id="end">다 읽었어요</button>
  `, 3);
  $('#tc').onclick = () => { opt.chunks = !opt.chunks; story(); };
  $('#tk').onclick = () => { opt.ko = !opt.ko; story(); };
  document.querySelectorAll('.sent').forEach(el => (el.onclick = () => openSheet(+el.dataset.s)));
  document.querySelectorAll('.gtag').forEach(el => (el.onclick = e => {
    e.stopPropagation();
    const g = grammar.find(g => g.anchor === el.dataset.g && g.chunk === +el.dataset.c);
    openSheet(sentences.findIndex(([a, b]) => g.range[0] >= a && g.range[0] < b), g.anchor);
  }));
  $('#end').onclick = end;
}

// 문장 풀이 시트(앱 시안 G와 같은 그룹 카드).
let playing = false;
function openSheet(k, openAnchor) {
  const [a, b] = sentences[k];
  document.querySelectorAll('.sent').forEach(el => el.classList.toggle('picked', +el.dataset.s === k));
  const chunks = D.chunks.filter((c, i) => chunkPos[i][0] < b && chunkPos[i][1] > a);
  const gs = grammar.filter(g => g.range[0] >= a && g.range[0] < b);
  const seen = new Set();
  const ws = []; let at = 0;
  for (const s of D.en) { if (s[1] && at >= a && at < b && !seen.has(s[1])) { seen.add(s[1]); ws.push(s); } at += s[0].length; }
  const text = plain.slice(a, b).trim();
  const en = renderRange(a, b, { slashes: true, dotted: true });
  const term = t => D.terms[t];
  const formOf = (surface, word) => D.forms[`${surface}|${word}`];
  const gRow = g => {
    const [main, sub] = g.note.split(' · ');
    const [l, r] = main.split(' = ');
    const tm = term(g.term);
    const m = tm.form.match(/^(.*?)\s*\((.*=.*)\)\s*$/);
    const formula = m ? m[1] : tm.form;
    const ex = m ? m[2].split(' · ')[0].split(' = ') : null;
    return `<button class="grow ${openAnchor === g.anchor ? 'open' : ''}" data-a="${esc(g.anchor)}">
        <span class="gtag" style="margin:0">${esc(g.term)}</span>
        <span class="eq"><b>${r ? `<i>${esc(l)}</i> = ${esc(r)}` : esc(main)}</b>${sub ? `<span>${esc(sub)}</span>` : ''}</span>${ICON.chev}</button>
      <div class="gopen" ${openAnchor === g.anchor ? '' : 'hidden'}>
        <div class="mean">${esc(tm.mean)}</div>
        ${tm.use ? `<div class="pt"><i>→</i><span><b>언제 · 어디서</b>${esc(tm.use)}</span></div>` : ''}
        ${tm.note ? `<div class="pt warn"><i>!</i><span><b>헷갈리기 쉬운 것</b>${esc(tm.note)}</span></div>` : ''}
        <div class="form"><small>모양</small><div class="f">${esc(formula)}</div>${ex ? `<div class="x">${esc(ex[0])}</div><div class="xk">${esc(ex[1])}</div>` : ''}</div>
      </div>`;
  };
  $('#sheet').innerHTML = `
    <div class="grab"></div>
    <div class="shead">
      <button class="circle play" id="sp" aria-label="이 문장 듣기"><span>${ICON.play}</span></button>
      <span class="ttl">1장 · ${esc(D.book.chapter)}</span>
      <button class="circle x" id="sx" aria-label="닫기"><span>${ICON.x}</span></button>
    </div>
    <div class="sbody">
      <div class="card"><div class="s-en">${en}</div>
        ${chunks.length ? `<div class="s-ko">${chunks.map(c => esc(c[1])).join(' <span class="sl">/</span> ')}</div>` : ''}</div>
      ${gs.length ? `<div class="label">문법 ${gs.length}</div><div class="card">${gs.map(gRow).join('')}</div>` : ''}
      <div class="label">단어 ${ws.length}<span>외운 단어는 형광펜</span></div>
      <div class="card"><div class="wgrid">${ws.map(([surface, id]) => {
        const w = D.words[id]; const f = formOf(surface, w.word);
        const known = D.learn.includes(id);
        return `<div class="wc"><span class="w ${known ? 'mark' : ''}">${esc(surface)}</span>${f ? `<span class="fm">${esc(w.word)} ${esc(f[0])}</span>` : ''}
          <div class="m">${esc(f ? f[1] : first(w.meaning))}</div></div>`;
      }).join('')}</div></div>
    </div>`;
  $('#scrim').style.display = 'block';
  requestAnimationFrame(() => { $('#scrim').classList.add('show'); $('#sheet').classList.add('show'); });
  $('#sx').onclick = closeSheet; $('#scrim').onclick = closeSheet;
  const sp = $('#sp');
  sp.onclick = () => {
    if (playing) { speechSynthesis.cancel(); playing = false; sp.querySelector('span').innerHTML = ICON.play; return; }
    playing = true; sp.querySelector('span').innerHTML = ICON.stop;
    say(text, () => { playing = false; sp.querySelector('span').innerHTML = ICON.play; });
  };
  document.querySelectorAll('.grow').forEach(r => (r.onclick = () => {
    r.classList.toggle('open'); r.nextElementSibling.hidden = !r.classList.contains('open');
  }));
  // 끌어 내려 닫기
  const sh = $('#sheet'); let y0 = null, dy = 0;
  sh.ontouchstart = e => { if ($('.sbody').scrollTop <= 0) { y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; } };
  sh.ontouchmove = e => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translateY(${dy}px)`; };
  sh.ontouchend = () => { if (y0 === null) return; sh.style.transition = ''; sh.style.transform = ''; y0 = null; if (dy > 96) closeSheet(); };
}
function closeSheet() {
  speechSynthesis.cancel(); playing = false;
  $('#scrim').classList.remove('show'); $('#sheet').classList.remove('show');
  document.querySelectorAll('.sent').forEach(el => el.classList.remove('picked'));
  setTimeout(() => ($('#scrim').style.display = 'none'), 250);
}

// 5. 끝
function end() {
  show(`
    <div class="big" style="margin-top:34px">방금 외운 5개,<br>셜록 홈스 첫 문단에<br>다 나왔어요</div>
    <div class="card facts">
      <div><span>앱 단어</span><b>3,306개 + 숙어 510개</b></div>
      <div><span>이야기에 나오는 단어</span><b>3,202개</b></div>
      <div><span>다시 쓴 이야기</span><b>19편</b></div>
    </div>
    <p class="small">외운 단어는 2 · 7 · 21일 뒤에 다시 물어봐요.<br>무료 · 광고 없음 · 가입 없음</p>
    <div class="spacer"></div>
    <a class="primary store" href="https://apps.apple.com/kr/app/id6819707350">App Store에서 받기</a>
    <p class="small">Android는 비공개 테스트 중이에요 · <a href="https://dansuki.com/android">먼저 써 보기 신청</a></p>
    <button class="ghost" id="again">처음부터 다시</button>
  `, 4);
  $('#again').onclick = () => { opt = { chunks: true, ko: true }; intro(); };
}

intro();
</script>
</body>
</html>
